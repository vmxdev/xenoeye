{
  "filter": "src net mynet",
  "debug": {"dump-flows": "none"},
  "fwm": [
    {"time": 30, "name": "total", "fields": ["packets", "octets"]},
    {"time": 30, "name": "proto", "fields": ["packets desc", "octets desc", "proto"]},
    {"time": 30, "name": "sources", "fields": ["packets desc", "octets desc", "src host"], "limit": 25},
    {"time": 30, "name": "destinations", "fields": ["packets desc", "octets desc", "dst host"], "limit": 25}
  ]
}

